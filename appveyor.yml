# AppVeyor configuration file
# https://www.appveyor.com/docs/appveyor-yml

# Select build environment
# https://www.appveyor.com/docs/build-environment/
# https://www.appveyor.com/docs/windows-images-software/
# Note: Default is "Visual Studio 2015", which is Server 2012 R2, which is
# not supported by node 25.3.
image: Visual Studio 2026

install:
  - ps: Install-Product node
  - npm -g install npm
  # Ignore package-lock.json.  This is done for a few reasons:
  # - To test against current versions of dependencies.
  # - To test installability for dependents (doesn't use package-lock.json).
  - if exist package-lock.json del package-lock.json
  - npm install

  # JDK 1.8 is used by default.
  # OpenAPI Generator requires Java 11 or later to avoid the following error:
  # Error: java.lang.UnsupportedClassVersionError:
  # org/openapitools/codegen/OpenAPIGenerator has been compiled by a more recent
  # version of the Java Runtime (class file version 55.0), this version of the
  # Java Runtime only recognizes class file versions up to 52.0
  # Use the most recent available JDK (currently 25)
  - set JAVA_HOME=C:\Program Files\Java\jdk25
  - set PATH=%JAVA_HOME%\bin;%PATH%
  - java -version

test_script:
  - node --version
  - npm --version
  - npm test

# Disable build step, which we don't need
build: off

# If any job fails, fail build immediately to avoid wasting time/resources.
matrix:
  fast_finish: true
